{% extends 'base.html' %}
{% load static %}

{% block body %}
<div class="min-h-screen bg-[#0D0D0D] flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-[#121212] border border-white/20 rounded-2xl p-8 space-y-6 shadow-2xl relative overflow-hidden">
    
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-xl bg-[#C5A059]/10 border border-[#C5A059]/40 flex items-center justify-center text-[#C5A059] mx-auto text-xl font-bold">
        <i class="bi bi-cpu"></i>
      </div>
      <h1 class="text-2xl font-serif text-white font-bold tracking-tight">Sign In to <span class="text-[#C5A059]">NexusAI</span></h1>
      <p class="text-xs text-white/50">Enter credentials to access autonomous software engineering workspace.</p>
    </div>

    <form method="POST" action="{% url 'login' %}" class="space-y-4 text-xs">
      {% csrf_token %}
      <div class="space-y-1">
        <label class="text-white/70 font-semibold uppercase">Username or Email</label>
        {{ login_form.username }}
      </div>

      <div class="space-y-1">
        <label class="text-white/70 font-semibold uppercase">Password</label>
        {{ login_form.password }}
      </div>

      <button type="submit" class="w-full bg-[#C5A059] text-[#0D0D0D] font-bold py-3 rounded-xl hover:bg-[#d8b46d] transition-all">
        Sign In
      </button>
    </form>

    <div class="text-center text-xs text-white/40 pt-2 border-t border-white/10">
      Don't have an account? <a href="{% url 'register' %}" class="text-[#C5A059] hover:underline font-semibold">Register here</a>
    </div>

  </div>
</div>
{% endblock %}
