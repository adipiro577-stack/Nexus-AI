{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}NexusAI — Autonomous Software Engineering Platform{% endblock %}</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom NexusAI CSS -->
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-[#0D0D0D] text-[#E5E5E5] flex flex-col min-h-screen font-sans selection:bg-[#C5A059]/30 selection:text-white">
  
  {% block body %}{% endblock %}

  <!-- Global Toast Notifications Container -->
  {% include "partials/toast.html" %}

  <!-- Core JavaScript Modules -->
  <script src="{% static 'js/main.js' %}"></script>
  <script src="{% static 'js/ai.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
