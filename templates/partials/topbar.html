<!-- Contextual Topbar / Breadcrumbs -->
<div class="bg-[#0D0D0D] border-b border-white/10 px-6 py-3 flex items-center justify-between">
  <div class="flex items-center space-x-3 text-xs font-mono">
    <span class="text-white/40">PROJECTS</span>
    <span class="text-white/20">/</span>
    <span class="text-[#C5A059] font-semibold">{{ active_project.name|default:"Nexus-Core Matching Engine" }}</span>
    <span class="text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/30 uppercase">
      {{ active_project.status|default:"active" }}
    </span>
  </div>

  <div class="flex items-center space-x-3 text-xs">
    <button id="btn-trigger-swarm" class="bg-[#C5A059]/10 border border-[#C5A059]/40 hover:bg-[#C5A059] hover:text-[#0D0D0D] text-[#C5A059] px-3 py-1.5 rounded-lg font-medium transition-all flex items-center space-x-2">
      <i class="bi bi-play-fill"></i>
      <span>Execute Agent Swarm Sequence</span>
    </button>
  </div>
</div>
